function fmtWan(v) { return Math.round(v).toLocaleString(); }
function fmtYi(v) { return (v / 10000).toFixed(2); }

// ===== KPI Cards =====
function renderKPI() {
    const ps = DATA.ps_2026[DATA.ps_2026.length - 1];
    const sq = DATA.sq_2026[DATA.sq_2026.length - 1];
    
    // Find 2025 July data for YoY
    const ps25_jul = DATA.ps_2025[6]; // index 6 = July
    const ps25_dec = DATA.ps_2025[11]; // December
    
    const monthVal = Math.round(ps["本月收入"]);
    const cumVal = (ps["累计收入"] / 10000).toFixed(2);
    
    // YoY: compare 2026 July cumulative vs 2025 July cumulative
    const yoy_cum = ps25_jul ? ((ps["累计收入"] - ps25_jul["累计收入"]) / ps25_jul["累计收入"] * 100).toFixed(1) : null;
    
    const kpis = [
        { label: "本月收入", valueHtml: monthVal.toLocaleString() + '<span class="kpi-unit">万元</span>', change: null },
        { label: "累计收入", valueHtml: cumVal + '<span class="kpi-unit">亿元</span>', change: ps["累计增幅"], suffix: "%", changeLabel: "同比增幅" },
        { label: "年进度", valueHtml: ps["累计进度"].toFixed(2) + '<span class="kpi-unit">%</span>', change: ps["累计进度"] - sq["全市进度"], suffix: "pp" },
        { label: "全市排名", valueHtml: ps["累计排名"] + '<span class="kpi-unit">名</span>', change: null },
        { label: "序时完成率", valueHtml: ps["序时目标完成率"].toFixed(2) + '<span class="kpi-unit">%</span>', change: null },
        { label: "2025全年", valueHtml: fmtYi(ps25_dec["累计收入"]) + '<span class="kpi-unit">亿元</span>', change: yoy_cum ? parseFloat(yoy_cum) : null, suffix: "% YoY", changeLabel: "同期对比" }
    ];
    
    const grid = document.getElementById("kpiGrid");
    grid.innerHTML = kpis.map(k => {
        let changeHtml = "";
        if (k.change !== null && k.change !== undefined) {
            const cls = k.change >= 0 ? "up" : "down";
            const sign = k.change >= 0 ? "+" : "";
            const label = k.changeLabel || "vs全市";
            changeHtml = `<div class="kpi-change ${cls}">${sign}${typeof k.change === 'number' ? k.change.toFixed(1) : k.change}${k.suffix || ""} ${label}</div>`;
        }
        return `
            <div class="kpi-card">
                <div class="kpi-label">${k.label}</div>
                <div class="kpi-value">${k.valueHtml}</div>
                ${changeHtml}
            </div>
        `;
    }).join("");
}

            { name: "邮务业务", value: profData["2.邮务业务"]?.["累计"] || 0 },
            { name: "电商业务", value: profData["3.电商业务"]?.["累计"] || 0 },
            { name: "国内特快", value: profData["1.国内特快"]?.["累计"] || 0 },
            { name: "快递包裹", value: profData["2.快递包裹"]?.["累计"] || 0 },
            { name: "国际业务", value: profData["3.国际业务"]?.["累计"] || 0 }
        ];
        option = {
            tooltip: { trigger: "item", formatter: "{b}: {c}万 ({d}%)" },
            color: GREEN.barPie,
            legend: { orient: "vertical", right: 10, top: "center" },
            series: [{ type: "pie", radius: ["40%", "70%"], center: ["40%", "50%"], data: mainCats,
                emphasis: { itemStyle: { shadowBlur: 10, shadowColor: "rgba(0,0,0,0.2)" } },
                label: { formatter: "{b}\n{d}%" }
            }]
        };
    } else {
        const barData = categories.map(c => ({ name: c.name, value: profData[c.key]?.["累计"] || 0 }));
        option = {
            tooltip: { trigger: "axis" },
            grid: { top: 20, bottom: 40, left: 80, right: 60 },
            xAxis: { type: "value", name: "万元" },
            yAxis: { type: "category", data: barData.map(d => d.name) },
            series: [{ type: "bar", data: barData.map(d => Math.round(d.value)),
                itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                    { offset: 0, color: GREEN.gradientStart }, { offset: 1, color: GREEN.gradientEnd }
                ]), borderRadius: [0, 4, 4, 0] },
                label: { show: true, position: "right", formatter: p => fmtWan(p.value) + "万" }
            }]
        };
    }
    profChart.setOption(option);
}

function switchProf(type) {
    document.querySelectorAll(".tab-container")[2].querySelectorAll(".tab-btn").forEach((btn, i) => {
        btn.classList.toggle("active", (type === "pie" && i === 0) || (type === "bar" && i === 1));
    });
    renderProfChart(type);
}

// ===== Ranking Chart =====
let rankingChart = echarts.init(document.getElementById("rankingChart"));

function renderRankingChart() {
    const units = DATA.latest_2026_units.filter(u => u["累计进度"] !== null).slice(0, 15);
    const option = {
        tooltip: { trigger: "axis" },
        grid: { top: 20, bottom: 40, left: 80, right: 40 },
        xAxis: { type: "value", name: "累计进度%" },
        yAxis: { type: "category", data: units.map(u => u.name).reverse(),
            axisLabel: { formatter: v => v === "坪山" ? "{a|" + v + "}" : v, rich: { a: { color: GREEN.primary, fontWeight: "bold" } } }
        },
        series: [{ type: "bar",
            data: units.map(u => ({ value: u["累计进度"], itemStyle: { color: u.name === "坪山" ? GREEN.primary : "#e0e0e0", borderRadius: [0, 4, 4, 0] } })).reverse(),
            label: { show: true, position: "right", formatter: "{c}%" }
        }]
    };
    rankingChart.setOption(option);
}

// ===== Ranking Table =====
function renderRankingTable() {
    const units = DATA.latest_2026_units.filter(u => u["累计进度"] !== null);
    const table = document.getElementById("rankingTable");
    let html = `<thead><tr>
        <th>排名</th><th>单位</th><th>累计收入(亿元)</th><th>同比增幅</th><th>年进度</th><th>序时完成率</th><th>盈缺(万元)</th>
    </tr></thead><tbody>`;
    
    units.forEach((u, i) => {
        const rank = i + 1;
        const rankCls = rank <= 3 ? `rank-${rank}` : "rank-other";
        const rowCls = u.name === "坪山" ? "highlight" : "";
        const progressColor = u["累计进度"] >= 60 ? "#006633" : u["累计进度"] >= 50 ? "#4CAF50" : "#f5222d";
        const cumYi = (u["累计收入"] / 10000).toFixed(2);
        
        html += `<tr class="${rowCls}">
            <td><span class="rank-badge ${rankCls}">${rank}</span></td>
            <td>${u.name}</td>
            <td>${cumYi}</td>
            <td style="color:${u["累计增幅"] >= 0 ? '#006633' : '#f5222d'}">${u["累计增幅"] >= 0 ? '+' : ''}${u["累计增幅"]}%</td>
            <td><span class="progress-bar"><span class="progress-fill" style="width:${u["累计进度"]}%;background:${progressColor}"></span></span> ${u["累计进度"]}%</td>
            <td>${u["序时目标完成率"] || '-'}%</td>
            <td style="color:${u["盈缺"] >= 0 ? '#006633' : '#f5222d'}">${u["盈缺"] >= 0 ? '+' : ''}${Math.round(u["盈缺"])}</td>
        </tr>`;
    });
    html += "</tbody>";
    table.innerHTML = html;
}

// ===== 2025 Full Year Review =====
let full2025Chart = echarts.init(document.getElementById("full2025Chart"));

function renderFull2025Chart() {
    const months = DATA.ps_2025.map(m => m.month);
    const ps = DATA.ps_2025;
    
    const option = {
        tooltip: { trigger: "axis", formatter: function(params) {
            let s = params[0].axisValue + "<br/>";
            params.forEach(p => {
                if (p.seriesName.includes("累计")) s += p.marker + p.seriesName + ": " + fmtYi(p.value) + "亿元<br/>";
                else s += p.marker + p.seriesName + ": " + fmtWan(p.value) + "万元<br/>";
            });
            return s;
        }},
        legend: { data: ["月度收入", "累计收入"], top: 0 },
        grid: { top: 40, bottom: 30, left: 55, right: 55 },
        xAxis: { type: "category", data: months },
        yAxis: [
            { type: "value", name: "万元(月度)", position: "left" },
            { type: "value", name: "亿元(累计)", position: "right", axisLabel: { formatter: v => (v/10000).toFixed(1) } }
        ],
        series: [
            { name: "月度收入", type: "bar", data: ps.map(p => Math.round(p["本月收入"])), itemStyle: { color: GREEN.light, borderRadius: [4,4,0,0] } },
            { name: "累计收入", type: "line", yAxisIndex: 1, data: ps.map(p => p["累计收入"]), itemStyle: { color: GREEN.primary }, smooth: true }
        ]
    };
    full2025Chart.setOption(option);
}

// ===== Init =====
renderKPI();
renderYoyChart("monthly");
renderTrendChart("revenue");
renderProfChart("pie");
renderRankingChart();
renderRankingTable();
renderFull2025Chart();

window.addEventListener("resize", () => {
    yoyChart.resize(); trendChart.resize(); profChart.resize();
    rankingChart.resize(); full2025Chart.resize();
});
</script>
